<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carbon footprint meal calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Carbon Footprint Meal Calculator</h1> 
    </header>

    <main class="layout">
      <section class="card">
        <h2>Build your meal</h2>

        <div class="field">   <!-- div c'est une paire qui doit rester collé -->
          <label for="food-select">Food</label>
          <select id="food-select"></select>
        </div>

        <div class="field">
          <label for="quantity">Quantity (g)</label>
          <input type="number" id="quantity" min="0" /> 
        </div>

        <button id="add-button">Add</button>
        <p id="message"></p>
      </section>

      <section class="card">
        <h2>My meal</h2>
        <ul id="basket"></ul>
        <p id="total"></p>
      </section>
    </main>
    
    <script src="script.js"></script>
  
  </body>
</html>
